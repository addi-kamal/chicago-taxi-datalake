# Catalogue Iceberg partagé avec Spark : même catalogue JDBC (PostgreSQL),
# même nom de catalogue ("iceberg"), même stockage S3.
# Valeurs lues dans l'environnement du conteneur (${ENV:...}).
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=${ENV:ICEBERG_CATALOG_NAME}
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=${ENV:ICEBERG_CATALOG_URI}
iceberg.jdbc-catalog.connection-user=${ENV:ICEBERG_CATALOG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_CATALOG_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=${ENV:ICEBERG_WAREHOUSE}
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Système de fichiers S3 natif (MinIO en local, Ceph RGW en prod)
fs.s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
